name: Branch Build CE (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - preview

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push_ghcr:
    name: Build-Push ${{ matrix.name }} (GHCR)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - name: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - name: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - name: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - name: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - name: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
